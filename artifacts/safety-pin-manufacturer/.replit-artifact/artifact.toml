kind = "web"
previewPath = "/"
title = "Safety Pin Manufacturer"
description = "A premium industrial website for a safety pin manufacturing company, with a responsive product catalog, engineering-led manufacturing story, quality systems, applications, and bulk RFQ conversion flow."
version = "1.0.0"
id = "artifacts/safety-pin-manufacturer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20323

[services.development]
run = "pnpm --filter @workspace/safety-pin-manufacturer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/safety-pin-manufacturer", "run", "build" ]
serve = "static"
publicDir = "artifacts/safety-pin-manufacturer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20323"
BASE_PATH = "/"
